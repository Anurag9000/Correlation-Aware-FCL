name: CIFAR-100 sequential local-task protocol
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Print fresh source-generated ledger before frozen-ledger check
        run: |
          python - <<'PY'
          import json
          from cafcl.full_matrix import manifest
          for choice in ('vit', 'cnn'):
              print('FROZEN_MANIFEST_'+choice+'='+json.dumps(manifest(model=choice),sort_keys=True),flush=True)
          PY
          python scripts/audit_stream_math.py
      - name: Run offline regression tests
        run: pytest -q
      - name: Verify the CIFAR-100-only factorial registry
        run: python scripts/validate_factorial_plans.py
