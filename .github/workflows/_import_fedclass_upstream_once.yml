name: One-time exact FedCLASS upstream import
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_import_fedclass_upstream_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-fedclass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import and verify byte-identical upstream tracked files
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          upstream="skylorh/FedCLASS"
          pinned="e03e30653165b76ddf980393794f395f838ee967"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          test ! -e FedCLASS || { echo "Refusing to overwrite pre-existing FedCLASS directory"; exit 1; }
          git clone --depth 1 --branch main "https://github.com/$upstream.git" "$tmp/upstream"
          actual_head="$(git -C "$tmp/upstream" rev-parse HEAD)"
          if [[ "$actual_head" != "$pinned" ]]; then
            echo "Upstream changed: expected $pinned; got $actual_head. Refusing import"
            exit 1
          fi

          mkdir FedCLASS
          rsync -a --exclude='.git' "$tmp/upstream/" FedCLASS/
          # Override the destination .gitignore: every upstream-tracked file
          # must be imported even when the parent repository ignores its path.
          git add -f -A -- FedCLASS/

          git -C "$tmp/upstream" ls-tree -r HEAD |
            awk -F '\t' '{ split($1,a," "); print a[1],a[3],"FedCLASS/"$2 }' |
            sort > "$tmp/expected"
          git ls-files --stage -- FedCLASS/ |
            awk -F '\t' '{ split($1,a," "); print a[1],a[2],$2 }' |
            sort > "$tmp/actual"
          diff -u "$tmp/expected" "$tmp/actual"

          original_count="$(wc -l < "$tmp/expected")"
          copied_count="$(wc -l < "$tmp/actual")"
          test "$original_count" -eq 25
          test "$copied_count" -eq "$original_count"
          echo "VERIFIED: $copied_count FedCLASS files with exact blob SHA and file modes"
          echo "PINNED_UPSTREAM_COMMIT=$pinned"

          # Keep this as a one-shot import, not a persistent workflow.
          git rm -- .github/workflows/_import_fedclass_upstream_once.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Vendor byte-identical FedCLASS source at e03e30653165"
          git push origin HEAD:main
