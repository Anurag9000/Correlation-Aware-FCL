name: One-time exact upstream source import
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_import_fcil_upstreams_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out existing project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import and byte-verify pinned source repositories
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT

          copy_exact_repo() {
            local folder="$1"
            local upstream="$2"
            local pinned="$3"
            local source="$temp_root/$folder"

            test ! -e "$folder" || { echo "Refusing to overwrite existing $folder"; exit 1; }
            git clone --depth 1 "https://github.com/$upstream.git" "$source"
            local head
            head="$(git -C "$source" rev-parse HEAD)"
            if [[ "$head" != "$pinned" ]]; then
              echo "Upstream $upstream changed from pinned HEAD $pinned to $head; refusing unverified import"
              exit 1
            fi

            mkdir "$folder"
            rsync -a --exclude='.git' "$source/" "$folder/"
            git add -f -A -- "$folder"

            git -C "$source" ls-tree -r HEAD |
              awk -F '\t' -v prefix="$folder/" '{ split($1, a, " "); print a[1], a[3], prefix $2 }' |
              sort > "$temp_root/$folder.expected"
            git ls-files --stage -- "$folder/" |
              awk -F '\t' '{ split($1, a, " "); print a[1], a[2], $2 }' |
              sort > "$temp_root/$folder.actual"

            diff -u "$temp_root/$folder.expected" "$temp_root/$folder.actual"
            echo "Verified exact tracked bytes and modes for $folder ($(wc -l < "$temp_root/$folder.expected") files)"
          }

          copy_exact_repo GLFC conditionWang/FCIL 11e161a9d57ecd14126201b7bd9a424137749ee5
          copy_exact_repo LGA JiahuaDong/LGA 867988ce6b2777b5d40ccb2e9ea09a7e70d5bf1e
          copy_exact_repo FEAT qizhuang-qz/FEAT 459bab31e19a4215bd1cadde22296507d9f3fdb6

          # Remove this one-time import workflow from the final tree.
          git rm -- .github/workflows/_import_fcil_upstreams_once.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Vendor byte-identical GLFC, LGA and FEAT upstream snapshots"
          git push origin HEAD:main
